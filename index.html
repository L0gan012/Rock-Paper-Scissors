<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>RPS / Neural Match</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Neural Match home">
          <span class="brand-mark" aria-hidden="true">+</span>
          <span>NEURAL MATCH</span>
        </a>
        <div class="model-status">
          <span class="status-dot"></span> MODEL ONLINE
        </div>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">ROCK / PAPER / SCISSORS <span>01</span></p>
        <h1 id="page-title">Make your move.</h1>
        <p class="intro-copy">
          A pattern-learning opponent is watching. Keep it guessing.
        </p>
      </section>

      <section class="scoreboard" aria-label="Game score">
        <div class="score-item score-item--player">
          <span>YOU</span><strong id="wins">0</strong>
        </div>
        <div class="score-divider">—</div>
        <div class="score-item">
          <span>DRAW</span><strong id="ties">0</strong>
        </div>
        <div class="score-divider">—</div>
        <div class="score-item score-item--opponent">
          <span>AI</span><strong id="losses">0</strong>
        </div>
      </section>

      <section class="arena" aria-label="Current round">
        <div class="arena-heading">
          <span>ROUND <b id="round-number">01</b></span
          ><span id="round-status">AWAITING INPUT</span>
        </div>
        <div class="versus-grid">
          <div class="fighter-card fighter-card--player">
            <div class="fighter-label"><span>01</span><span>PLAYER</span></div>
            <div class="hand-display" id="player-display"><span>?</span></div>
          </div>
          <div class="versus">VS</div>
          <div class="fighter-card fighter-card--ai">
            <div class="fighter-label">
              <span>02</span><span>ADAPTIVE AI</span>
            </div>
            <div class="hand-display" id="computer-display"><span>?</span></div>
          </div>
        </div>
        <p class="round-message" id="round-message">
          Choose a hand to start the round
        </p>
      </section>

      <section class="selection" aria-labelledby="selection-title">
        <div class="selection-heading">
          <h2 id="selection-title">Select your hand</h2>
          <span>BEST OF ∞</span>
        </div>
        <div class="choice-grid">
          <button
            class="choice-button"
            type="button"
            data-choice="rock"
            aria-label="Choose rock"
          >
            <img src="/Images/player-rock-hand.jpg" alt="" /><span>ROCK</span
            ><b>R</b>
          </button>
          <button
            class="choice-button"
            type="button"
            data-choice="paper"
            aria-label="Choose paper"
          >
            <img src="/Images/player-paper-hand.jpg" alt="" /><span>PAPER</span
            ><b>P</b>
          </button>
          <button
            class="choice-button"
            type="button"
            data-choice="scissors"
            aria-label="Choose scissors"
          >
            <img src="/Images/player-scissors-hand.jpg" alt="" /><span
              >SCISSORS</span
            ><b>S</b>
          </button>
        </div>
      </section>

      <footer class="footer">
        <span>ADAPTIVE PLAYGROUND</span><span>RPS / 2026</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
